name: Prototype validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate application shell and inline JavaScript
        run: python3 scripts/validate_prototype.py
      - name: Scan repository for committed credentials
        run: |
          ! grep -RIE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]+' --exclude-dir=.git .
